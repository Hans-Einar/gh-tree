name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v0.1.0-bootstrap"

permissions:
  contents: write

jobs:
  release:
    name: Publish precompiled extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify release commit
        run: |
          go test ./...
          go vet ./...
      - uses: cli/gh-extension-precompile@v2
        with:
          go_version_file: go.mod
          go_build_options: ./cmd/gh-tree
          release_tag: ${{ github.ref == 'refs/heads/release/v0.1.0-bootstrap' && 'v0.1.0' || github.ref_name }}
