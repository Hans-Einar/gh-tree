name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
      - "codereview-21/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Accepted target inventory and M3 prerequisites
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.inventory.outputs.targets }}
      runtime-helper: ${{ steps.inventory.outputs.runtime-helper }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Require all twelve accepted targets and classify Runtime prerequisites
        id: inventory
        shell: bash
        run: |
          matrix=$(go run ./internal/composition/architecture -targets)
          echo "targets=$matrix" >> "$GITHUB_OUTPUT"
          state=$(go run ./internal/composition/architecture -runtime-prerequisite)
          echo "runtime-helper=$state" >> "$GITHUB_OUTPUT"
          if [[ "$state" == pending-m3 ]]; then
            echo 'Runtime helper conformance NOT RUN: M3 Runtime/helper inputs have not been integrated.' >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architecture: x64
            goarch: amd64
          - os: macos-latest
            architecture: arm64
            goarch: arm64
          - os: windows-latest
            architecture: x64
            goarch: amd64
          - os: windows-11-arm
            architecture: arm64
            goarch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          architecture: ${{ matrix.architecture }}
      - name: Record actual native environment
        shell: pwsh
        env:
          EXPECTED_GOARCH: ${{ matrix.goarch }}
        run: |
          Write-Output "source=$env:GITHUB_SHA ref=$env:GITHUB_REF run=$env:GITHUB_RUN_ID attempt=$env:GITHUB_RUN_ATTEMPT"
          Write-Output "runner=$env:RUNNER_OS/$env:RUNNER_ARCH image=$env:ImageOS version=$env:ImageVersion"
          Write-Output ([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)
          Write-Output "host=$([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture) shell=$($PSVersionTable.PSVersion)"
          go version
          go env GOHOSTOS GOHOSTARCH GOOS GOARCH CGO_ENABLED GOTOOLCHAIN
          git --version
          gh --version
          go list -m all
          if ((go env GOARCH) -ne $env:EXPECTED_GOARCH -or (go env GOHOSTARCH) -ne $env:EXPECTED_GOARCH) { throw 'Native Go architecture mismatch' }
          if ($env:EXPECTED_GOARCH -eq 'arm64' -and [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') { throw 'ARM64 job is not on native ARM64' }
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/gh-tree

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  release-targets:
    name: Build and architecture ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.targets) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check selected production, exported types and separate test imports
        run: go run ./internal/composition/architecture -target '${{ matrix.goos }}/${{ matrix.goarch }}'
      - name: Cross-compile exact public asset name
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: v1
          GO386: sse2
          GOARM: '7'
          GOARM64: v8.0
        run: go build -trimpath -o '${{ runner.temp }}/${{ matrix.asset }}' ./cmd/gh-tree

  runtime-helper:
    name: Runtime helper source closure and reproducibility (M3)
    needs: prepare
    if: needs.prepare.outputs.runtime-helper == 'ready'
    runs-on: windows-latest
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          architecture: x64
      - name: Require canonical builder and real Runtime-owned verifier
        shell: pwsh
        run: |
          go version
          go env GOHOSTOS GOHOSTARCH
          if ((go env GOVERSION) -ne 'go1.25.0' -or (go env GOHOSTOS) -ne 'windows' -or (go env GOHOSTARCH) -ne 'amd64') { throw 'Wrong canonical helper builder' }
          go run ./internal/runtime/cmd/helpergen -check
          if ($LASTEXITCODE -ne 0) { throw 'Runtime helper source-closure/rebuild verification failed' }
          if (git status --porcelain --untracked-files=all -- internal/runtime) { throw 'Helper verification changed committed or untracked Runtime inputs' }
      - name: Ordinary committed-input build without generation
        run: go build -trimpath -o '${{ runner.temp }}/gh-tree.exe' ./cmd/gh-tree

  freebsd-native:
    name: Native FreeBSD amd64 (new stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Restrict builder-key VM control to this disposable runner
        shell: bash
        run: |
          # AnyVM also binds detected private addresses. Deny new inbound TCP
          # outside loopback; established download replies remain allowed.
          sudo iptables -I INPUT 1 ! -i lo -p tcp -m conntrack --ctstate NEW -j DROP
          sudo ip6tables -I INPUT 1 ! -i lo -p tcp -m conntrack --ctstate NEW -j DROP
      - name: Execute on FreeBSD 15.0 amd64 guest disk
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: '15.0'
          arch: x86_64
          sync: rsync
          copyback: 'false'
          disable-cache: 'true'
          cache-after-prepare: 'false'
          debug-on-error: 'false'
          prepare: |
            set -eu
            pkg install -y git-lite ca_root_nss
            fetch -o /tmp/go.tar.gz https://go.dev/dl/go1.25.0.freebsd-amd64.tar.gz
            test "$(sha256 -q /tmp/go.tar.gz)" = 86e6fe0a29698d7601c4442052dac48bd58d532c51cccb8f1917df648138730b
            tar -C /usr/local -xzf /tmp/go.tar.gz
          run: |
            set -eu
            sh .github/scripts/freebsd-native.sh
      - name: Retain bounded guest evidence even on test failure
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/freebsd-evidence"
          printf 'source=%s run=%s attempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/freebsd-evidence/host.txt"
          sudo iptables -C INPUT ! -i lo -p tcp -m conntrack --ctstate NEW -j DROP
          sudo ip6tables -C INPUT ! -i lo -p tcp -m conntrack --ctstate NEW -j DROP
          echo 'Non-loopback new inbound TCP denied (IPv4 and IPv6).' >> "$RUNNER_TEMP/freebsd-evidence/host.txt"
          ss -ltnp >> "$RUNNER_TEMP/freebsd-evidence/host.txt"
          # Copy only named logs, never a guest tree, credentials, fixtures or binaries.
          for file in native.log tests.jsonl packages.txt failure-control.log failure-control.jsonl acl.txt xattr-user.txt xattr-system.txt; do
            ssh -o ConnectTimeout=10 freebsd "cat /home/ghci/results/$file" > "$RUNNER_TEMP/freebsd-evidence/$file" || echo "Evidence unavailable: $file" >> "$RUNNER_TEMP/freebsd-evidence/host.txt"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: freebsd-native-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/freebsd-evidence
          retention-days: 7
